<svg width="1400" height="950" viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>URL Shortener system architecture</title>
<desc>React frontend calls an Nginx gateway, which proxies to the Express API. The API queries MySQL, reads/writes a Redis cache, and enqueues click events to Redis for a separate BullMQ worker to process asynchronously into MySQL. Structured logging monitors the gateway, API, and worker. A CI pipeline validates and deploys the gateway/API.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1400" height="950" fill="#0a0b0f"/>
<rect x="40" y="8" width="150" height="5" rx="2.5" fill="#f97316"/>
<rect x="24" y="22" width="1352" height="906" rx="16" fill="#0d0f14" stroke="#262a33" stroke-width="1.5"/>

<!-- ===== SOLID (synchronous) CONNECTORS ===== -->
<path d="M194,560 C260,545 330,545 396,560" fill="none" stroke="#cfd3da" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M430,526 C480,420 560,378 666,318" fill="none" stroke="#cfd3da" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M734,282 C900,228 1050,200 1196,218" fill="none" stroke="#cfd3da" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M736,316 C900,418 1050,500 1196,538" fill="none" stroke="#cfd3da" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- ===== DASHED (async / background) CONNECTORS ===== -->
<path d="M722,336 C880,460 1020,542 1196,570" fill="none" stroke="#8b90a0" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M734,560 C900,560 1050,560 1196,560" fill="none" stroke="#8b90a0" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M714,528 C850,380 1000,270 1196,238" fill="none" stroke="#8b90a0" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M430,364 C420,420 420,470 430,526" fill="none" stroke="#8b90a0" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
<path d="M464,320 C540,312 600,306 666,302" fill="none" stroke="#8b90a0" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
<path d="M464,344 C560,420 610,500 666,548" fill="none" stroke="#8b90a0" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
<path d="M700,766 C600,700 500,650 430,594" fill="none" stroke="#8b90a0" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>

<!-- ===== EDGE LABELS ===== -->
<g font-family="Inter, system-ui, sans-serif">
  <rect x="262" y="530" width="58" height="20" rx="4" fill="#0d0f14"/>
  <text x="291" y="544" text-anchor="middle" font-size="12" fill="#cfd3da">REST</text>

  <rect x="472" y="405" width="90" height="20" rx="4" fill="#0d0f14"/>
  <text x="517" y="419" text-anchor="middle" font-size="12" fill="#cfd3da">proxy_pass</text>

  <rect x="905" y="200" width="90" height="20" rx="4" fill="#0d0f14"/>
  <text x="950" y="214" text-anchor="middle" font-size="12" fill="#cfd3da">query (TLS)</text>

  <rect x="905" y="450" width="130" height="20" rx="4" fill="#0d0f14"/>
  <text x="970" y="464" text-anchor="middle" font-size="12" fill="#cfd3da">cache-aside read</text>

  <rect x="880" y="525" width="90" height="20" rx="4" fill="#0d0f14"/>
  <text x="925" y="539" text-anchor="middle" font-size="12" fill="#8b90a0">enqueue</text>

  <rect x="900" y="545" width="180" height="20" rx="4" fill="#0d0f14"/>
  <text x="990" y="559" text-anchor="middle" font-size="12" fill="#8b90a0">dequeue · retry w/ backoff</text>

  <rect x="850" y="330" width="130" height="20" rx="4" fill="#0d0f14"/>
  <text x="915" y="344" text-anchor="middle" font-size="12" fill="#8b90a0">writes click records</text>

  <rect x="540" y="680" width="110" height="20" rx="4" fill="#0d0f14"/>
  <text x="595" y="694" text-anchor="middle" font-size="12" fill="#8b90a0">build · deploy</text>
</g>

